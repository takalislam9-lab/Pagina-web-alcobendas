# ============================================================================
# Decap CMS — Panel de gestión de Joyería Bruno (accesible en /admin)
# ============================================================================
backend:
  name: git-gateway
  branch: main

# backend:
#   name: github
#   repo: takalislam9-lab/joyeria-bruno
#   branch: main

local_backend: true
locale: es
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "ajustes"
    label: "⚙️ Ajustes de la joyería"
    files:
      - name: "general"
        label: "Datos de contacto"
        file: "content/ajustes.json"
        description: "Teléfono, WhatsApp, dirección, horario e imagen principal."
        fields:
          - { name: "telefono", label: "Teléfono (visible)", widget: "string" }
          - { name: "whatsapp", label: "WhatsApp (solo números con prefijo)", widget: "string", hint: "Ej.: 34620936722" }
          - { name: "email", label: "Email", widget: "string", required: false }
          - { name: "direccion", label: "Dirección", widget: "text" }
          - name: "horario"
            label: "Horario"
            widget: "list"
            fields: [{ name: "linea", label: "Línea de horario", widget: "string" }]
          - { name: "hero_imagen", label: "Imagen de fondo del inicio (opcional)", widget: "image", required: false }

  - name: "catalogo"
    label: "💎 Catálogo de joyas y relojes"
    files:
      - name: "productos"
        label: "Piezas del catálogo"
        file: "content/productos.json"
        description: "Añade, edita o quita piezas. Aparecen al instante en la web."
        fields:
          - name: "productos"
            label: "Piezas"
            label_singular: "Pieza"
            widget: "list"
            summary: "{{fields.nombre}} — {{fields.categoria}}"
            fields:
              - { name: "nombre", label: "Nombre", widget: "string" }
              - name: "categoria"
                label: "Categoría"
                widget: "select"
                options: ["Relojes", "Anillos", "Alianzas", "Pendientes", "Collares", "Pulseras", "Bautizo y comunión"]
              - { name: "precio", label: "Precio (€)", widget: "number", required: false, value_type: "float", hint: "Vacío = 'Consultar'." }
              - { name: "descripcion", label: "Descripción", widget: "text", required: false }
              - { name: "imagen", label: "Foto de la pieza", widget: "image", required: false }
              - { name: "disponible", label: "Disponible", widget: "boolean", default: true }
              - { name: "destacado", label: "Destacada", widget: "boolean", default: false }

  - name: "testimonios"
    label: "⭐ Opiniones de clientes"
    files:
      - name: "lista"
        label: "Testimonios"
        file: "content/testimonios.json"
        description: "Opiniones mostradas en la sección de confianza."
        fields:
          - name: "testimonios"
            label: "Testimonios"
            label_singular: "Testimonio"
            widget: "list"
            summary: "{{fields.nombre}} ({{fields.valoracion}}★)"
            fields:
              - { name: "nombre", label: "Nombre del cliente", widget: "string" }
              - { name: "texto", label: "Opinión", widget: "text" }
              - { name: "valoracion", label: "Estrellas (1-5)", widget: "number", default: 5, min: 1, max: 5, value_type: "int" }
              - { name: "fecha", label: "Fecha", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, required: false }
